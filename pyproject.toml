[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibridge"
version = "0.1.0"
description = "Convert data between formats (CSV, Excel, JSON, XML, HL7 v2, FHIR) from one example of the output, with human review."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multibridge = "multibridge.cli:main"

[tool.setuptools.packages.find]
include = ["multibridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # evalset/ (phase 9) is not part of the package
