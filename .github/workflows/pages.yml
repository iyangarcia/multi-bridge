# Publishes the live demo on GitHub Pages on every push to master: the web app with the Python running
# in the visitor's browser (Pyodide, rules only). Built by scripts/build_pages.py; nothing secret in it.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:        # a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write              # publish to Pages
  id-token: write           # prove to Pages that this workflow is the one publishing

concurrency:                # one deploy at a time; a running one is not cut off halfway
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # Pyodide's Python: the build precompiles the .py files for it
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the tests      # a broken commit never reaches the demo
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q
      - name: Build the demo
        run: python scripts/build_pages.py --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
